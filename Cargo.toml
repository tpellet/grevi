[package]
name = "hunch"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Point at the right thing: pick, why, run and is by meaning — fast CLI on TypeSafe Jev"
repository = "https://github.com/tpellet/hunch"
homepage = "https://github.com/tpellet/hunch"
readme = "README.md"
keywords = ["cli", "llm", "semantic", "pointer", "jev"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
directories = "6"
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "macros", "time", "sync"] }
toon-format = { version = "0.5", default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
