title = "jevify gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known-benign placeholders and public data"
regexes = [
  '''TYPESAFE_API_KEY=(test-key|dummy|wrong|k)\b''',
  '''\.env\("TYPESAFE_API_KEY",\s*"(test-key|k)"\)''',
  '''\$HOME/\.ssh/typesafe-ai-key''',
]
paths = [
  # A manifest of sha256 digests of the held-out inputs; each value is the file's own digest,
  # verified against the file. High entropy, no secret.
  '''^evals/holdout/inputs\.sha256\.json$''',
  '''^evals/prototype/eval_nl2bash_out\.json$''',
  '''^evals/prototype/eval_intents_out\.json$''',
]
