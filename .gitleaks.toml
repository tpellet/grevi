title = "grevi gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known-benign placeholders and public data"
regexes = [
  '''TYPESAFE_API_KEY=(test-key|dummy|wrong|k)\b''',
  '''\.env\("TYPESAFE_API_KEY",\s*"(test-key|k)"\)''',
  '''\$HOME/\.ssh/typesafe-ai-key''',
]
paths = [
  '''^evals/prototype/eval_nl2bash_out\.json$''',
  '''^evals/prototype/eval_intents_out\.json$''',
]
