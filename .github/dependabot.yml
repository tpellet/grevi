version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The tag is the Rust toolchain version, chosen by hand: 1.87.0 is the MSRV job
      # (rust-version in Cargo.toml), 1.93.1 matches rust-toolchain.toml.
      - dependency-name: "dtolnay/rust-toolchain"
      # release.yml is generated by cargo-dist, and its plan job fails on a hand edit.
      # These two are used only there; they move with a cargo-dist upgrade.
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      # Used by ci.yml and by the generated release.yml. Bump ci.yml by hand, and
      # release.yml through cargo-dist.
      - dependency-name: "actions/checkout"
