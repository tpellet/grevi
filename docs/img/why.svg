<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">jevify why finds the one error in 1,812 lines of cargo output</title>
  <desc id="d">The command jevify why with build.log on stdin is typed. 1,812 lines of compiler output scroll by, 300 warnings among them. jevify keeps 1,212 distinct lines, judges them in 7 windows, compares the finalists once, and prints line 2 with its context: error[E0425]: cannot find value conifg in this scope, probability 0.90. Exit 0. Output of jevify 0.8.0 on Jev 1.13.0.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .dim { fill: #7d8590; }
    .small { font-size: 12.5px; }
    .label { font-size: 12.5px; fill: #7d8590; letter-spacing: .04em; }
    .win { fill: #3fb950; font-weight: 700; }
    .warn { fill: #d29922; }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    #cover { animation: type 14s steps(26) infinite; }
    #stream { animation: scroll 14s linear infinite; }
    #left { animation-name: left; }
    #s1 { animation-name: s1; } #s2 { animation-name: s2; } #s3 { animation-name: s3; }
    #hl { animation-name: hl; } #out { animation-name: out; } #foot { animation-name: foot; } #all { animation-name: all; }
    @keyframes type { 0% { transform: translateX(0); } 9%, 100% { transform: translateX(260px); } }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-600px); } }
    @keyframes left { 0%, 9% { opacity: 0; } 12%, 100% { opacity: 1; } }
    @keyframes s1 { 0%, 18% { opacity: 0; } 21%, 100% { opacity: 1; } }
    @keyframes s2 { 0%, 27% { opacity: 0; } 30%, 100% { opacity: 1; } }
    @keyframes s3 { 0%, 36% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @keyframes hl { 0%, 46% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes out { 0%, 44% { opacity: 0; } 48%, 100% { opacity: 1; } }
    @keyframes foot { 0%, 60% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes all { 0% { opacity: 0; } 2%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a, #cover, #stream { animation: none !important; } #cover { display: none; } }
  </style>
  <defs>
    <clipPath id="col"><rect x="24" y="92" width="290" height="240"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset=".18" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset=".82" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="960" height="430" rx="10" fill="#0d1117"/>
  <g id="all" class="a">
    <text x="24" y="40"><tspan class="dim">$ </tspan>jevify why &lt; build.log</text>
    <rect id="cover" x="42" y="22" width="280" height="26" fill="#0d1117"/>

    <g id="left" class="a">
      <text x="24" y="80" class="label">1,812 LINES, 300 WARNINGS, 1 ERROR</text>
      <g clip-path="url(#col)">
        <g id="stream" class="dim small">
          <text x="24" y="110">warning: unused variable: `unused_12`</text>
          <text x="24" y="130">  --&gt; src/main.rs:14:9</text>
          <text x="24" y="150">   |</text>
          <text x="24" y="170">14 |     let unused_12 = 12;</text>
          <text x="24" y="190">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="210">warning: unused variable: `unused_13`</text>
          <text x="24" y="230">  --&gt; src/main.rs:15:9</text>
          <text x="24" y="250">   |</text>
          <text x="24" y="270">15 |     let unused_13 = 13;</text>
          <text x="24" y="290">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="310">warning: unused variable: `unused_14`</text>
          <text x="24" y="330">  --&gt; src/main.rs:16:9</text>
          <text x="24" y="350">   |</text>
          <text x="24" y="370">16 |     let unused_14 = 14;</text>
          <text x="24" y="390">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="410">warning: unused variable: `unused_15`</text>
          <text x="24" y="430">  --&gt; src/main.rs:17:9</text>
          <text x="24" y="450">   |</text>
          <text x="24" y="470">17 |     let unused_15 = 15;</text>
          <text x="24" y="490">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="510">warning: unused variable: `unused_16`</text>
          <text x="24" y="530">  --&gt; src/main.rs:18:9</text>
          <text x="24" y="550">   |</text>
          <text x="24" y="570">18 |     let unused_16 = 16;</text>
          <text x="24" y="590">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="610">warning: unused variable: `unused_17`</text>
          <text x="24" y="630">  --&gt; src/main.rs:19:9</text>
          <text x="24" y="650">   |</text>
          <text x="24" y="670">19 |     let unused_17 = 17;</text>
          <text x="24" y="690">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="710">warning: unused variable: `unused_12`</text>
          <text x="24" y="730">  --&gt; src/main.rs:14:9</text>
          <text x="24" y="750">   |</text>
          <text x="24" y="770">14 |     let unused_12 = 12;</text>
          <text x="24" y="790">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="810">warning: unused variable: `unused_13`</text>
          <text x="24" y="830">  --&gt; src/main.rs:15:9</text>
          <text x="24" y="850">   |</text>
          <text x="24" y="870">15 |     let unused_13 = 13;</text>
          <text x="24" y="890">   |         ^^^^^^^^^ help: prefix with `_`</text>
          <text x="24" y="910">warning: unused variable: `unused_14`</text>
          <text x="24" y="930">  --&gt; src/main.rs:16:9</text>
        </g>
      </g>
      <rect x="24" y="92" width="290" height="240" fill="url(#fade)"/>
    </g>

    <text x="350" y="80" class="label">HOW IT GETS THERE</text>
    <g id="s1" class="a">
      <text x="350" y="108" class="small"><tspan class="dim">1 </tspan>1,212 distinct lines; blank and repeated lines dropped</text>
    </g>
    <g id="s2" class="a">
      <text x="350" y="132" class="small"><tspan class="dim">2 </tspan>7 windows judged at the same time, 3 finalists each</text>
    </g>
    <g id="s3" class="a">
      <text x="350" y="156" class="small"><tspan class="dim">3 </tspan>one comparison of the 21 finalists; "none of them" is an option</text>
    </g>

    <rect id="hl" class="a" x="340" y="214" width="596" height="24" rx="5" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".55"/>
    <g id="out" class="a">
      <text x="350" y="184" class="dim small">jevify why: 1812 lines, candidates 1212, windows 7</text>
      <text x="350" y="207" class="dim">      1 │    Compiling buildfail v0.1.0</text>
      <text x="350" y="231" class="win">&gt;     2 │ error[E0425]: cannot find value `conifg` in this scope</text>
      <text x="350" y="255" class="dim">      3 │    --&gt; src/main.rs:306:20</text>
      <text x="350" y="279" class="dim">      4 │     |</text>
      <text x="350" y="303" class="dim">      5 │ 306 |     println!("{}", conifg);</text>
    </g>
    <g id="foot" class="a">
      <line x1="24" y1="350" x2="936" y2="350" stroke="#21262d"/>
      <text x="24" y="378"><tspan class="win">line 2 of 1,812</tspan><tspan class="dim">   p 0.90   exit 0   one process, 8 requests, 0.9 s</tspan></text>
      <text x="24" y="404" class="dim small">the full log is saved and its path printed, so the way back is one command</text>
    </g>
  </g>
</svg>
