<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">jevify sort reads the files in a Downloads folder and proposes a folder for each</title>
  <desc id="d">Five files with unhelpful names. jevify reads each one. document(3).txt holds a 1099 tax form and goes to Taxes/2025 at 0.69. BP_UA1523.txt is a boarding pass and goes to Boarding passes at 0.99. 1706.03762v7.txt is a research paper and goes to Papers at 0.89. A utility statement and a note fit no folder and stay where they are. It is a dry run: nothing moves until --apply, and --undo moves everything back. Output of jevify 0.3.0 on 2026-09-19.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .dim { fill: #7d8590; }
    .small { font-size: 12.5px; }
    .label { font-size: 12.5px; fill: #7d8590; letter-spacing: .04em; }
    .ok { fill: #3fb950; }
    .stay { fill: #d29922; }
    .folder { fill: #79c0ff; }
    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .cmd { font-size: 17px; font-weight: 700; }
    .verb { fill: #3fb950; }
    #all { animation-name: all; } #panes { animation-name: panes; }
    #f1 { animation-name: f1; } #f2 { animation-name: f2; } #f3 { animation-name: f3; }
    #s1 { animation-name: s1; } #s2 { animation-name: s2; } #s3 { animation-name: s3; } #s4 { animation-name: s4; } #s5 { animation-name: s5; }
    #p1 { animation-name: p1; } #p2 { animation-name: p2; } #p3 { animation-name: p3; } #p4 { animation-name: p4; } #p5 { animation-name: p5; }
    #foot { animation-name: foot; }
    @keyframes all { 0% { opacity: 0; } 2%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes panes { 0%, 7% { opacity: 0; } 10%, 100% { opacity: 1; } }
    /* s = what jevify read in the file; shown, then gone once the file has an answer */
    @keyframes s1 { 0%, 11% { opacity: 0; } 13%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 27% { opacity: 0; } 29%, 38% { opacity: 1; } 41%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 43% { opacity: 0; } 45%, 54% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 59% { opacity: 0; } 61%, 67% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes s5 { 0%, 71% { opacity: 0; } 73%, 79% { opacity: 1; } 82%, 100% { opacity: 0; } }
    /* f = the file name travels from the left list to its folder */
    @keyframes f1 { 0%, 21% { transform: translate(0, 0); } 27%, 100% { transform: translate(584px, 24px); } }
    @keyframes f2 { 0%, 37% { transform: translate(0, 0); } 43%, 100% { transform: translate(564px, 74px); } }
    @keyframes f3 { 0%, 53% { transform: translate(0, 0); } 59%, 100% { transform: translate(564px, 86px); } }
    /* p = the verdict */
    @keyframes p1 { 0%, 26% { opacity: 0; } 28%, 100% { opacity: 1; } }
    @keyframes p2 { 0%, 42% { opacity: 0; } 44%, 100% { opacity: 1; } }
    @keyframes p3 { 0%, 58% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @keyframes p4 { 0%, 68% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @keyframes p5 { 0%, 80% { opacity: 0; } 82%, 100% { opacity: 1; } }
    @keyframes foot { 0%, 85% { opacity: 0; } 88%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } .snip { display: none; } }
  </style>

  <rect width="960" height="430" rx="10" fill="#0d1117"/>
  <!-- the command stays visible for the whole loop: it is the point of the picture -->
  <rect x="16" y="16" width="928" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="28" y="40" class="cmd"><tspan class="dim">$ </tspan><tspan class="verb">jevify sort</tspan> ~/Downloads</text>
  <g id="all" class="a">

    <g id="panes" class="a">
      <text x="24" y="84" class="label">~/DOWNLOADS: NAMES THAT SAY NOTHING</text>
      <text x="584" y="84" class="label">THE FOLDERS YOU ALREADY HAVE</text>
      <line x1="548" y1="70" x2="548" y2="360" stroke="#21262d"/>

      <text x="584" y="116" class="folder">Taxes/</text>
      <text x="604" y="140" class="folder">2025/</text>
      <text x="584" y="196" class="folder">Receipts/</text>
      <text x="584" y="232" class="folder">Boarding passes/</text>
      <text x="584" y="292" class="folder">Papers/</text>
      <text x="584" y="348" class="folder">Screenshots/</text>

      <!-- stay-put files sit in the left list the whole time -->
      <text x="40" y="276">stmt_0814.txt</text>
      <text x="40" y="320">untitled.txt</text>
    </g>

    <!-- what jevify read in each file -->
    <g class="small dim">
      <text id="s1" class="a snip small dim" x="40" y="158">reads: "Form 1099-INT 2025 · Payer: Ally Bank · Interest income"</text>
      <text id="s2" class="a snip small dim" x="40" y="202">reads: "UNITED AIRLINES boarding pass · EWR to SFO · Seat 24C"</text>
      <text id="s3" class="a snip small dim" x="40" y="246">reads: "Attention Is All You Need · Abstract: The dominant sequence…"</text>
      <text id="s4" class="a snip small dim" x="40" y="294">reads: "Con Edison · Statement date: August 14 · Amount due: $86.40"</text>
      <text id="s5" class="a snip small dim" x="40" y="338">reads: "random notes · buy milk · call the plumber"</text>
    </g>

    <!-- the three files that find a home -->
    <g id="panes2" class="a" style="animation-name:panes">
      <text id="f1" class="a" x="40" y="140">document(3).txt</text>
      <text id="f2" class="a" x="40" y="184">BP_UA1523.txt</text>
      <text id="f3" class="a" x="40" y="228">1706.03762v7.txt</text>
    </g>

    <text id="p1" class="a ok" x="880" y="164">0.69</text>
    <text id="p2" class="a ok" x="880" y="258">0.99</text>
    <text id="p3" class="a ok" x="880" y="314">0.89</text>
    <text id="p4" class="a stay small" x="200" y="276">no folder fits with confidence: stays</text>
    <text id="p5" class="a stay small" x="200" y="320">no folder fits with confidence: stays</text>

    <g id="foot" class="a">
      <line x1="24" y1="372" x2="936" y2="372" stroke="#21262d"/>
      <text x="24" y="398">This was a dry run: nothing moved.</text>
      <text x="24" y="418" class="dim small">--apply moves the three files and writes an undo log · --undo moves them back · jevify never overwrites or deletes a file</text>
    </g>
  </g>
</svg>
