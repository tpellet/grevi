<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">jevify fill turns a description of a commit into the real commit, then runs git show on it</title>
  <desc id="d">The command jevify fill -- git show --stat --format=%s with the marker @{commit:stopped sending the free backend batches it refuses} is typed. The 171 commits of the branch scroll by. jevify lists them with git log, judges the marker's description against every subject, and keeps commit 7bcf70c, "fix: keyless batches of at most 60 records, 402 named", with probability 0.93; the next best commit scores 0.04 and "none of them" 0.02. jevify replaces itself with git show --stat --format=%s 7bcf70c, and git prints the subject and the 11 changed files. Output of jevify 0.8.0 on Jev 1.13.0.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .dim { fill: #7d8590; }
    .small { font-size: 12.5px; }
    .label { font-size: 12.5px; fill: #7d8590; letter-spacing: .04em; }
    .win { fill: #3fb950; font-weight: 700; }
    .mark { fill: #d2a8ff; }
    .bar { fill: #30363d; transform-box: fill-box; transform-origin: left center; }
    .barwin { fill: #3fb950; transform-box: fill-box; transform-origin: left center; }
    .a { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    #cover1 { animation: type1 16s steps(40) infinite; }
    #cover2 { animation: type2 16s steps(60) infinite; }
    #stream { animation: scroll 16s linear infinite; }
    #left { animation-name: left; } #how { animation-name: how; }
    #r1 { animation-name: r1; } #r2 { animation-name: r2; } #r3 { animation-name: r3; }
    #b1 { animation-name: b1; } #b2 { animation-name: b2; } #b3 { animation-name: b3; }
    #hl { animation-name: hl; } #exec { animation-name: exec; } #git { animation-name: git; } #all { animation-name: all; }
    @keyframes type1 { 0% { transform: translateX(0); } 7%, 100% { transform: translateX(420px); } }
    @keyframes type2 { 0%, 7% { transform: translateX(0); } 15%, 100% { transform: translateX(640px); } }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-560px); } }
    @keyframes left { 0%, 15% { opacity: 0; } 18%, 100% { opacity: 1; } }
    @keyframes how { 0%, 22% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes r1 { 0%, 32% { opacity: 0; } 35%, 100% { opacity: 1; } }
    @keyframes r2 { 0%, 36% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @keyframes r3 { 0%, 40% { opacity: 0; } 43%, 100% { opacity: 1; } }
    @keyframes b1 { 0%, 34% { transform: scaleX(0); } 42%, 100% { transform: scaleX(1); } }
    @keyframes b2 { 0%, 38% { transform: scaleX(0); } 46%, 100% { transform: scaleX(1); } }
    @keyframes b3 { 0%, 42% { transform: scaleX(0); } 50%, 100% { transform: scaleX(1); } }
    @keyframes hl { 0%, 50% { opacity: 0; } 54%, 100% { opacity: 1; } }
    @keyframes exec { 0%, 58% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @keyframes git { 0%, 66% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @keyframes all { 0% { opacity: 0; } 2%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a, #cover1, #cover2, #stream { animation: none !important; } #cover1, #cover2 { display: none; } }
  </style>
  <defs>
    <clipPath id="col"><rect x="24" y="116" width="300" height="200"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset=".18" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset=".82" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="960" height="470" rx="10" fill="#0d1117"/>
  <g id="all" class="a">
    <text x="24" y="40"><tspan class="dim">$ </tspan>jevify fill -- git show --stat --format=%s \</text>
    <rect id="cover1" x="42" y="22" width="440" height="26" fill="#0d1117"/>
    <text x="24" y="64">    <tspan class="mark">'@{commit:stopped sending the free backend batches it refuses}'</tspan></text>
    <rect id="cover2" x="60" y="46" width="660" height="26" fill="#0d1117"/>

    <g id="left" class="a">
      <text x="24" y="104" class="label">171 COMMITS ON THE BRANCH, FROM git log</text>
      <g clip-path="url(#col)">
        <g id="stream" class="dim small">
          <text x="24" y="134">2996c1f chore: beads before release 0.8.0</text>
          <text x="24" y="154">dcb0623 chore: release 0.8.0</text>
          <text x="24" y="174">c5dda08 chore: deadline in capabilities</text>
          <text x="24" y="194">7e70a39 feat: one deadline per verb</text>
          <text x="24" y="214">79c3450 docs: init agents pairs situations</text>
          <text x="24" y="234">d4e9c13 chore: beads after evaluation fixes</text>
          <text x="24" y="254">b9e3143 feat: dir finalists carry names</text>
          <text x="24" y="274">7bcf70c fix: keyless batches of at most 60</text>
          <text x="24" y="294">a91fae2 fix: fill's abstention line names</text>
          <text x="24" y="314">68bafb3 fix: a marker in argv[0] names tool</text>
          <text x="24" y="334">a3df8ef test: lister runner pipe test</text>
          <text x="24" y="354">f1d4aa6 feat: why and pick state counts</text>
          <text x="24" y="374">9cf8269 test: doc examples run in own repo</text>
          <text x="24" y="394">57948ba chore: beads after evaluation</text>
          <text x="24" y="414">fbd314e docs: keyless quota per verb</text>
          <text x="24" y="434">522762e chore: close release 0.7.0</text>
          <text x="24" y="454">07bcbb4 chore: beads after hunch-con</text>
          <text x="24" y="474">f757afb chore: release 0.7.0</text>
          <text x="24" y="494">f676b25 fix: file excerpts carry meaning</text>
          <text x="24" y="514">9ddf5d8 chore: beads after Phase 3 and 4</text>
          <text x="24" y="534">1c9f91b docs: kinds in capabilities</text>
          <text x="24" y="554">107b83b feat: fill and pick --from resolve</text>
          <text x="24" y="574">d3db489 chore: beads after hunch-qxn</text>
          <text x="24" y="594">f1d266e docs: label in capabilities</text>
          <text x="24" y="614">15b75a1 feat: coded kinds commit, file, dir</text>
          <text x="24" y="634">3ec58c3 feat: label tags each stdin record</text>
          <text x="24" y="654">01a7eaa chore: beads after hunch-7zg.15</text>
          <text x="24" y="674">11bf017 feat: recipe engine, shipped recipes</text>
          <text x="24" y="694">2996c1f chore: beads before release 0.8.0</text>
          <text x="24" y="714">dcb0623 chore: release 0.8.0</text>
          <text x="24" y="734">c5dda08 chore: deadline in capabilities</text>
          <text x="24" y="754">7e70a39 feat: one deadline per verb</text>
          <text x="24" y="774">79c3450 docs: init agents pairs situations</text>
          <text x="24" y="794">d4e9c13 chore: beads after evaluation fixes</text>
          <text x="24" y="814">b9e3143 feat: dir finalists carry names</text>
          <text x="24" y="834">7bcf70c fix: keyless batches of at most 60</text>
          <text x="24" y="854">a91fae2 fix: fill's abstention line names</text>
          <text x="24" y="874">68bafb3 fix: a marker in argv[0] names tool</text>
        </g>
      </g>
      <rect x="24" y="116" width="300" height="200" fill="url(#fade)"/>
    </g>

    <g id="how" class="a">
      <text x="360" y="104" class="label">THE MARKER NAMES A KIND; THE KIND LISTS WHAT EXISTS</text>
      <text x="360" y="130" class="small"><tspan class="mark">@{commit:</tspan><tspan>…</tspan><tspan class="mark">}</tspan><tspan class="dim">  candidates: git log; evidence: subject, body, paths</tspan></text>
      <text x="360" y="152" class="small dim">every subject judged against the description; "none" is an option</text>
    </g>

    <rect id="hl" class="a" x="350" y="176" width="586" height="34" rx="6" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".55"/>
    <g id="r1" class="a">
      <text x="362" y="198" class="win">7bcf70c</text>
      <rect x="440" y="187" width="80" height="12" rx="3" class="barwin a" id="b1"/>
      <text x="532" y="198" class="win">0.93</text>
      <text x="582" y="198" class="small">fix: keyless batches of at most 60 rec…</text>
    </g>
    <g id="r2" class="a">
      <text x="362" y="238" class="dim">next best</text>
      <rect x="440" y="227" width="4" height="12" rx="3" class="bar a" id="b2"/>
      <text x="532" y="238" class="dim">0.04</text>
    </g>
    <g id="r3" class="a">
      <text x="362" y="278" class="dim">none of them</text>
      <rect x="440" y="267" width="2" height="12" rx="3" class="bar a" id="b3"/>
      <text x="532" y="278" class="dim">0.02</text>
    </g>

    <g id="exec" class="a">
      <line x1="24" y1="330" x2="936" y2="330" stroke="#21262d"/>
      <text x="24" y="356" class="small dim">jevify fill: exec 'git' 'show' '--stat' '--format=%s' '7bcf70cd91fc3d9e306d60ea0436a02983be3d6f'</text>
    </g>
    <g id="git" class="a">
      <text x="24" y="384">fix: keyless batches of at most 60 records, 402 named (hunch-0it)</text>
      <text x="24" y="408" class="dim small"> src/cmd/filter.rs            | 15 ++++++---------</text>
      <text x="24" y="428" class="dim small"> src/jev/client.rs            | 27 +++++++++++++++++++++++----</text>
      <text x="24" y="448" class="dim small"> 11 files changed, 97 insertions(+), 38 deletions(-)      <tspan class="win">git ran; jevify is gone</tspan></text>
    </g>
  </g>
</svg>
